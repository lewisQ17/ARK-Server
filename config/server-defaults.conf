# ARK Server Default Settings
# These defaults apply to every new map unless overridden in maps/<MapName>/map.conf
# Lines starting with # are comments

# ─── Server Identity ───
DefaultMaxPlayers=70
DefaultServerPassword=
DefaultAdminPassword=

# ─── Network Ports (auto-incremented per map if conflicts) ───
DefaultGamePort=7777
DefaultQueryPort=27015
DefaultRCONPort=27020

# ─── Startup Flags ───
DefaultStartParams=-NoBattlEye -crossplay -NoHangDetection

# ─── Rates ───
XPMultiplier=1.0
TamingSpeedMultiplier=1.0
HarvestAmountMultiplier=1.0
ResourceRespawnPeriodMultiplier=1.0
MatingIntervalMultiplier=1.0
BabyMatureSpeedMultiplier=1.0
EggHatchSpeedMultiplier=1.0
PlayerDamageMultiplier=1.0
DinoDamageMultiplier=1.0
PlayerResistanceMultiplier=1.0
DinoResistanceMultiplier=1.0
DinoCountMultiplier=1.0

# ─── Quality of Life ───
ShowMapPlayerLocation=True
AllowThirdPersonPlayer=True
ServerCrosshair=True
AllowHitMarkers=True
RCONEnabled=True
AutoSavePeriodMinutes=15
KickIdlePlayersPeriod=3600
MaxTamedDinos=5000
ItemStackSizeMultiplier=1.0

# ─── Structures ───
AlwaysAllowStructurePickup=True
StructurePickupTimeAfterPlacement=30
StructurePickupHoldDuration=0.5
TheMaxStructuresInRange=10500
PlatformSaddleBuildAreaBoundsMultiplier=1.0
PerPlatformMaxStructuresMultiplier=1.0

# ─── Cluster ───
ClusterID=
