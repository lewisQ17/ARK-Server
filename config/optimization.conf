# ARK Server Performance Optimization
# Applied automatically during install and can be re-applied from the menu

# ─── Linux Kernel Tuning ───
# These sysctl values are written to /etc/sysctl.d/99-ark-server.conf
vm.swappiness=10
net.core.rmem_max=26214400
net.core.wmem_max=26214400
net.core.rmem_default=1048576
net.core.wmem_default=1048576
net.ipv4.udp_mem=65536 131072 262144

# ─── Game Engine (nullrhi disables rendering for headless server) ───
# Headless mode — no GPU needed on a dedicated server
UseNullRHI=true

# ─── Graphics / Scalability (GameUserSettings.ini [ScalabilityGroups]) ───
# 0 = lowest, 3 = highest — keep everything at 0 for a dedicated server
sg.ResolutionQuality=0
sg.ViewDistanceQuality=0
sg.AntiAliasingQuality=0
sg.ShadowQuality=0
sg.GlobalIlluminationQuality=0
sg.ReflectionQuality=0
sg.PostProcessQuality=0
sg.TextureQuality=0
sg.EffectsQuality=0
sg.FoliageQuality=0
sg.ShadingQuality=0
sg.LandscapeQuality=0

# ─── Resolution (minimum for headless) ───
ResolutionSizeX=640
ResolutionSizeY=480
ScreenPercentage=0.1
FrameRateLimit=30

# ─── Engine tweaks (/Engine/Config/BaseEngine.ini) ───
# Reduce tick rate jitter
bSmoothFrameRate=True
SmoothedFrameRateRange_Lower=15
SmoothedFrameRateRange_Upper=30
NetServerMaxTickRate=30

# ─── Memory ───
# ASA uses ~6-8GB per map. Swap should be 1-2GB as emergency only.
RecommendedSwapGB=1
# Delete .pdb debug files after install to save ~2GB
DeletePDBFiles=true

# ─── Process Priority ───
# nice -5 gives the server slightly higher CPU priority
ServerNiceLevel=-5
