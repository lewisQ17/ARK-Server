# ARK Server Performance Optimization
# Applied automatically during install and can be re-applied from the menu

# ─── Linux Kernel Tuning ───
# These sysctl values are written to /etc/sysctl.d/99-ark-server.conf
vm.swappiness=10
net.core.rmem_max=26214400
net.core.wmem_max=26214400
net.core.rmem_default=1048576
net.core.wmem_default=1048576
net.ipv4.udp_mem=65536 131072 262144

# ─── Game Engine (nullrhi disables rendering for headless server) ───
# Headless mode — no GPU needed on a dedicated server
UseNullRHI=true

# ─── Graphics / Scalability (GameUserSettings.ini [ScalabilityGroups]) ───
# Managed by ark-manager.sh graphics preset system
# Presets: low (0), medium (2), high (3), auto (3 + dynamic resolution)
# Use the 'Graphics Preset' option in Server Settings menu to change
# Default: high (all quality groups at 3, 1920x1080, all effects on)
sg.ResolutionQuality=3
sg.ViewDistanceQuality=3
sg.AntiAliasingQuality=3
sg.ShadowQuality=3
sg.GlobalIlluminationQuality=3
sg.ReflectionQuality=3
sg.PostProcessQuality=3
sg.TextureQuality=3
sg.EffectsQuality=3
sg.FoliageQuality=3
sg.ShadingQuality=3
sg.LandscapeQuality=3

# ─── Resolution (per preset) ───
# Low:    640x480,  30fps,  ScreenPct=0.1
# Medium: 1280x720, 60fps,  ScreenPct=75
# High:   1920x1080, unlimited, ScreenPct=100
# Auto:   1920x1080, unlimited, ScreenPct=100 + dynamic resolution
ResolutionSizeX=1920
ResolutionSizeY=1080
ScreenPercentage=100.0
FrameRateLimit=0

# ─── Engine tweaks (/Engine/Config/BaseEngine.ini) ───
# Reduce tick rate jitter
bSmoothFrameRate=True
SmoothedFrameRateRange_Lower=15
SmoothedFrameRateRange_Upper=30
NetServerMaxTickRate=30

# ─── Memory ───
# ASA uses ~6-8GB per map. Swap should be 1-2GB as emergency only.
RecommendedSwapGB=1
# Delete .pdb debug files after install to save ~2GB
DeletePDBFiles=true

# ─── Process Priority ───
# nice -5 gives the server slightly higher CPU priority
ServerNiceLevel=-5
